name: Cleanup branch validation

on:
  push:
    branches: [chore/cleanup-unused-code]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-unused-code-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head or branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and reconcile lockfile
        run: npm install --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: reconcile package lock after dependency cleanup"
            git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
          else
            echo "package-lock.json is already reconciled."
          fi
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Lint
        run: npm run lint
      - name: Expo dependency diagnostics
        run: npx expo-doctor
