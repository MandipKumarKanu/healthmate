name: P2 Code Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EXPO_PUBLIC_OCR_API_URL: ${{ secrets.EXPO_PUBLIC_OCR_API_URL || secrets.OCR_API_URL }}
      EXPO_PUBLIC_OCR_API_KEY: ${{ secrets.EXPO_PUBLIC_OCR_API_KEY || secrets.OCR_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📝 Configure Environment (.env) from GitHub Secrets
        run: |
          echo "EXPO_PUBLIC_OCR_API_URL=${{ secrets.EXPO_PUBLIC_OCR_API_URL || secrets.OCR_API_URL }}" >> .env
          echo "EXPO_PUBLIC_OCR_API_KEY=${{ secrets.EXPO_PUBLIC_OCR_API_KEY || secrets.OCR_API_KEY }}" >> .env

      - name: Install dependencies
        # npm install is temporary until the P1 native OCR dependency and lockfile are reconciled.
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Lint
        run: npm run lint
