name: HealthMate Android 1.1.0

on:
  push:
    branches:
      - release/healthmate-1.1.0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: healthmate-1-1-0-android
  cancel-in-progress: false

jobs:
  android-release:
    name: Install, validate, and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main-derived release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund

      - name: Commit refreshed package-lock if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh package-lock for v1.1.0"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "package-lock.json is already up to date."
          fi

      - name: Verify package and app versions
        run: |
          node -e "const p=require('./package.json'); const a=require('./app.json'); if(p.version!=='1.1.0'||a.expo.version!=='1.1.0'||a.expo.android.versionCode!==2) process.exit(1); console.log('HealthMate', p.version, 'Android versionCode', a.expo.android.versionCode)"

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: healthmate-1.1.0-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
